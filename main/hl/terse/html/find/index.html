// Applies a saved table-of-contents width before the first paint.
//
// This is a tiny inline counterpart to toc-resize.js: it runs in the page head so that
// returning desktop readers do not see the default width flash to their saved width.
// It only records the width in the --verso-toc-user-width custom property; the
// stylesheet clamps it and ignores it on mobile, and toc-resize.js then takes over the
// interactive resizing. Keep the storage key in sync with toc-resize.js.

(function () {
    try {
        const saved = localStorage.getItem("verso-toc-width");
        // Parse to a number (as toc-resize.js does) and write that back, so a stored
        // value with stray whitespace becomes a valid length rather than `" 420 px"`.
        const width = saved === null ? NaN : Number(saved);
        if (Number.isFinite(width)) {
            document.documentElement.style.setProperty("--verso-toc-user-width", `${width}px`);
        }
    } catch (_) {
        // Leave the default width in place when local storage is unavailable.
    }
})();

:root {
  --sf-bg: #fffdf6;
  --sf-text: #1a1208;
  --sf-heading: #6b0d0d;
  --sf-accent: #a00;
  --sf-link: #7a1a1a;
  --sf-link-hover: #a00;
  /* Block-level surfaces (code blocks, the TOC column, callouts) are a neutral
     light gray rather than a tint of the warm page color, so highlighted Lean
     reads against a plain backdrop. */
  --sf-code-bg: #f1f1f0;
  --sf-rule: #dcdcda;
  --sf-toc-bg: #f6f6f5;
  --sf-surface: #f4f4f3;

  /* Override Verso's syntax highlighting palette */
  --verso-code-keyword-color: #697f2f;
  --verso-code-const-color: #416DFF;
}

body {
  /* Software Foundations LF background — same image and layout as the
     original site (no-repeat, full width, scrolls with the page so it
     fades off the top as you read down). The body color is plain white,
     matching the original SF site, so the area below the image (once it
     has scrolled off) shows the same neutral backdrop the SF book uses. */
  background-color: white;
  background-image: url('assets/prog_lang_bg.jpg');
  background-repeat: no-repeat;
  background-size: 100% auto;
  background-position: top left;
  background-attachment: scroll;
  color: var(--sf-text);
}

/* Solid card behind the actual prose so the background image never bleeds
   through the text itself. */
main .content-wrapper {
  background: var(--sf-bg);
  padding: 1.5rem var(--verso--content-padding-x);
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
  border-radius: 2px;
}

main h1, main h2, main h3, main h4, main h5, main h6,
.header-title, .toc-title h1 {
  color: var(--sf-heading);
}

/* A section whose heading is full-only (see
   SFLMeta.Block.suppressPreviousHeaderWhenTerse): the marker div is present
   only in the terse build, where the heading hides. */
section:has(> .suppress-previous-header-when-terse)
    > :is(h1, h2, h3, h4, h5, h6):first-child {
  display: none;
}

a, a:visited { color: var(--sf-link); }
a:hover, a:active { color: var(--sf-link-hover); }

header {
  background: var(--sf-bg);
  border-bottom: 1px solid var(--sf-rule);
  box-shadow: none;
}

#toc {
  background: var(--sf-toc-bg) !important;
  border-right: 1px solid var(--sf-rule);
}

code:not(.hl), pre:not(.hl) {
  background: var(--sf-code-bg);
  padding: 0.1em 0.3em;
  border-radius: 2px;
}

pre:not(.hl) {
  padding: 0.6em 0.9em;
  border-left: 3px solid var(--sf-accent);
  background: var(--sf-code-bg);
}

.hl.lean.block {
  background: var(--sf-code-bg);
  border-left: 3px solid var(--sf-accent);
  padding: 0.6em 0.9em;
  border-radius: 2px;
}

blockquote {
  border-left: 3px solid var(--sf-accent);
  background: var(--sf-surface);
  margin-left: 0;
  padding: 0.4em 1em;
  color: #2b2b28;
}

/* Build stamp: when this page was generated, matching the trailing comment in
   the generated .lean file of the same chapter (SFLMeta/BuildStamp.lean).  It
   is a provenance note, not something to read, so it is small, gray, and set
   off below a rule. */
.sf-build-stamp {
  margin-top: 2.5em;
  padding-top: 0.5em;
  border-top: 1px solid var(--sf-rule);
  font-size: 0.8em;
  font-style: italic;
  text-align: right;
  color: #8c8c88;
}

/* Tighten the exercise box to share the same palette */
.exercise {
  background: var(--sf-surface);
  border-left: 3px solid var(--sf-accent);
}

@media (hover: hover) {
  /* Hovered content nested in a collapsed tactic region keeps its plain background: the
     region's proof state is the tooltip that appears there, and its label is what
     highlights. `:where` keeps the exclusion out of the specificity computation. */
  .hl.lean .token.binding-hl,
  .hl.lean :is(.literal, .token.typed, .token[data-verso-hover]):hover:not(:where(.tactic:has(> .tactic-toggle:not(:checked)) > label *)) {
    background-color: var(--verso-code-hover-bg-color, #eeeeee);
    border-radius: 2px;
    transition: none;
  }

  /* Within a hovered message span, token hover backgrounds are removed so the span's own
     hover background shows across the whole span. The exception is a hovered documented
     token, which keeps its background because its tooltip is the one shown. */

  .hl.lean .has-info:hover .token.binding-hl:not([data-verso-hover]),
  .hl.lean .has-info:hover .literal:hover:not([data-verso-hover]),
  .hl.lean .has-info:hover .token.typed:hover:not([data-verso-hover]) {

/*
The hover highlight follows the tooltip: a message span highlights only when its own tooltip
is the one that appears. When a hovered nested message span, a hovered documented token, or
a hovered collapsed tactic label shows its own tooltip instead, the message span does not
highlight. A span nested in a collapsed tactic region likewise stays plain, because hovering
it shows the region's proof state; `:where` keeps that exclusion out of the specificity
computation.

The hover colors come from `--verso--region-hover-color` and `--verso--region-hover-bg-color`,

because the properties inherit, a region nested inside one of another severity keeps its own

    background-color: var(--verso--region-hover-bg-color, transparent);

/*

    });
    document.querySelectorAll('.hl.lean .has-info.information').forEach(element => {
      element.setAttribute('data-tippy-theme', 'info message');
    });
    document.querySelectorAll('.hl.lean .has-info.error').forEach(element => {
      element.setAttribute('data-tippy-theme', 'error message');
    });
    document.querySelectorAll('.hl.lean .tactic').forEach(element => {
      element.setAttribute('data-tippy-theme', 'tactic');
    });
    // Skip tokens inside closed tactics — they interfere with tactic tippys
    const closedTactics = new Set();
    document.querySelectorAll('.hl.lean .tactic').forEach(tactic => {
      const toggle = tactic.querySelector(':scope > input.tactic-toggle');
      if (toggle && !toggle.checked) closedTactics.add(tactic);
    });
    function isInsideClosedTactic(el) {
      const tactic = el.closest('.tactic');
      return tactic && tactic !== el && closedTactics.has(tactic);
    }

    const tokenSelector = '.hl.lean .const.token, .hl.lean .keyword.token, .hl.lean .literal.token, .hl.lean .option.token, .hl.lean .var.token, .hl.lean .typed.token, .hl.lean .has-info, .hl.lean .tactic, .hl.lean .level-var, .hl.lean .level-const, .hl.lean .level-op, .hl.lean .sort';

    const tacticTippySelector = '.const.token, .keyword.token, .literal.token, .option.token, .var.token, .typed.token, .has-info, .level-var, .level-const, .level-op, .sort';
    document.querySelectorAll('.hl.lean .tactic').forEach(tactic => {
      const toggle = tactic.querySelector(':scope > input.tactic-toggle');
      if (toggle) toggle.addEventListener('change', () => {
        if (toggle.checked) {
          closedTactics.delete(tactic);
          tactic.querySelectorAll(tacticTippySelector).forEach(el => {
            if (!el._tippy) {
              tippy(el, defaultTippyProps);

        } else {
          closedTactics.add(tactic);
          tactic.querySelectorAll(tacticTippySelector).forEach(el => {
            if (el._tippy) el._tippy.destroy();
          });
        }
        // The toggle changes which element's tooltip belongs to the pointer's position,
        // but the pointer stays put, so no hover event announces the change. Show the
        // right tooltip once the click that flipped the toggle has hidden the old one.
        setTimeout(() => {
          if (hoverTarget && hoverTarget.isConnected) {
            const showable = innermostShowable(hoverTarget);
            if (showable && showable._tippy) showable._tippy.show();
          }
        }, 0);
      });

// @ts-check
/**
 * @type URLSearchParams
 */
let params = new URLSearchParams(document.location.search);
/**
 * @type string[]
 */
let domains = params.getAll("domain");
/**
 * @type string | null
 */
let paramName = params.get("name");

/**
 * @typedef {{id: string, address: string, data: any}} Item // Metadata for one particular item. The `data` depends on the domain.
 * @typedef {Record<string, Item[]>} DomainData // A mapping from canonical names to metadata. The array is usually a singleton.
 * @typedef {{title: string | null, description: string | null, contents: DomainData}} Domain
 * @typedef {Record<string, Domain>} XRef
 */

let xref = /** @type {{xref: XRef}} */ (/** @type {unknown} */ (window)).xref;

if (paramName) {
    /**
     * @type (Item & {domain: string})[]
     */
    let options = [];
    if (domains && domains.length > 0) {
        for (const i in domains) {
            let domain = domains[i];
            console.log("Considering domain " + domain);
            if (xref.hasOwnProperty(domain)) {
                console.log("Found domain " + domain);
                let opts = xref[domain];
                if (opts["contents"].hasOwnProperty(paramName)) {
                    options = opts["contents"][paramName].map((x) =>
                        Object.assign(x, { domain: domain }),
                    );
                }
            }
        }
    } else {
        for (const [dom, opts] of Object.entries(xref)) {
            if (opts["contents"].hasOwnProperty(paramName)) {
                for (const i of opts["contents"][paramName]) {
                    options.push(Object.assign(i, { domain: dom }));
                }
            }
        }
    }

    if (options.length == 0) {
        addEventListener("DOMContentLoaded", (_event) => {
            document.title = "Not found: '" + paramName + "'";
            const titleElem = document.querySelector("#title");
            if (titleElem) {
                titleElem.innerHTML = "Not found: name '" + paramName + "'";
            }
            let allDomains = [];
            for (const d in xref) {
                allDomains.push(d);
            }
            if (domains.length < 1) {
                domains = allDomains;
            }
            const messageElem = document.querySelector("#message");
            if (messageElem) {
                messageElem.innerHTML = `
                    <p>Searched domains:</p>
                    <ul>
                        ${domains
                            .map((x) => `<li><code>${x}</code>: ${xref[x]["title"]}</li>`)
                            .join("")}
                    </ul>
                `;
            }
        });
    } else if (options.length == 1) {
        // Currently, our stored options look like absolute paths ('/Axiom').
        // This makes them relative ('Axiom') so that they will be set relative to the <base> tag
        const addr = new URL(options[0]["address"].replace(/^\//, ""), document.baseURI);
        addr.hash = options[0]["id"];
        window.location.replace(addr);
    } else {
        addEventListener("DOMContentLoaded", (_event) => {
            document.title = "Ambiguous: '" + paramName + "'";
            const titleElem = document.querySelector("#title");
            if (titleElem) {
                titleElem.innerHTML = "Ambiguous: name '" + paramName + "'";
            }
            const messageElem = document.querySelector("#message");
            if (messageElem) {
                messageElem.innerHTML = `
                    <p>Options:</p>
                    <ul>
                        ${options
                            .map(
                                (x, _idx) =>
                                    `<li>
                                <p>
                                    <a href="${x["address"] + "#" + x["id"]}">
                                        From ${xref[x["domain"]]["title"]}
                                    </a>
                                </p>
                            </li>`,
                            )
                            .join("\n")} +
                    </ul>
                `;
            }
        });
    }
} else {
    addEventListener("DOMContentLoaded", (_event) => {
        document.title = "No name provided";
        const titleElem = document.querySelector("#title");
        if (titleElem) {
            titleElem.innerHTML = "No name provided";
        }
        const messageElem = document.querySelector("#message");
        if (messageElem) {
            messageElem.innerHTML = `
                <p>This page expects a 'name' query parameter, along with documentation domains.</p>
            `;
        }
    });
}
</script>
